<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Every Picture</title>

    <!-- normalize -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">

    <!-- style -->
    <link href="styles.css" rel="stylesheet">

    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand&family=Shadows+Into+Light&display=swap" rel="stylesheet">

    <!-- js -->
    <script src="script.js" defer></script>
</head>

<body>

    <!-- menu  -->
    <div id="albumSelection">
        <p id="rezeButton" class="albumButton">reze arc.</p>
        <p id="nameButton" class="albumButton">your name.</p>
         <!-- next to albums -->
        <p class="instruction" id="albumInstruction">← Change photo albums</p>
    </div>

    <header id="header">
        <h1 id="title">Memories</h1>
        <p id="titleText">Stories of photos from Japan that are related to two movies: <a href="https://www.imdb.com/title/tt5311514/">'Your Name'</a> and <a href="https://www.imdb.com/title/tt30472557/">'Chainsaw Man – The Movie: Reze Arc'</a></p>
    </header>

    <!--  -->
    <main id="cardContainer">
        

        <div class="wholeCard" id="rezeArc">
            <div class="cardInner currentCard">
                <div class="frontSide">
                    <img src="images/rezeArc/card1.jpg" alt="card1">
                </div>
                
                <div class="backSide">
                    <div class="circle">
                        <h1 class="photoNumber">1</h1>
                    </div>
                    
                    <p class="captionText">First stop at the station, one of the only stops that opened to the outside</p>
                </div>
            </div>

            <p class="instruction" id="photoInstruction">← Click to learn more</p>
        </div>
        
    </main>

    <!-- arrows -->
    <div id="arrowsTgt">
        <p class="instruction" id="arrowInstruction">← Cycle through photos</p>

        <svg id="leftArrow" width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="10" stroke="#b0b0b0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M17 12H7M17 12L13 8M17 12L13 16" stroke="#b0b0b0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>

        <svg id="rightArrow" width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="10" stroke="#b0b0b0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M17 12H7M17 12L13 8M17 12L13 16" stroke="#b0b0b0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </div>

   
</body>
</html>
