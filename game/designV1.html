<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design V1</title>

    <style>
        body {
            background-color: rgb(229, 229, 229);
        }

        img {
            width: 800px;
            height: auto;
        }

        h2 {
            font-family: Arial, Helvetica, sans-serif;

        }

        main {
            display: flex;
            flex-direction: column;
            gap: 64px;

            align-items: center;
            justify-content: center;
        }

        div {
            display: flex;
            flex-direction: column;
            gap: 8px;
            
            align-items: center;
            justify-content: center;
        }

    </style>

</head>

<body>

    <main>
        <div id="1">
            <h2>Thumbnails</h2>
            <img src="images/thumbnail.jpg" alt="thumbnails">
        </div>

        <div id="2">
            <h2>Sketch</h2>
            <img src="images/sketch.jpg" alt="sketch">
        </div>

        <div id="3">
            <h2>Digital Comp</h2>
            <img src="images/digitalComp1.png" alt="digitalComp1">
            <img src="images/digitalComp2.png" alt="digitalComp2">
        </div>
        

        

    </main>
    
</body>
</html>
